---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - wget
      - curl
      - tar
      - adduser
    state: present
    update_cache: true

# ============================================================
# Node Exporter
# ============================================================

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download node_exporter
  ansible.builtin.get_url:
    url: https://github.com/prometheus/node_exporter/releases/download/v1.9.1/node_exporter-1.9.1.linux-amd64.tar.gz
    dest: /tmp/node_exporter.tar.gz
    mode: "0644"

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/node_exporter-1.9.1.linux-amd64

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: /tmp/node_exporter-1.9.1.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: "0755"
    remote_src: true
  notify: Restart node_exporter

- name: Create node_exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=0.0.0.0:{{ node_exporter_port }}
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify:
    - Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

# ============================================================
# Prometheus
# ============================================================

- name: Create prometheus user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download Prometheus
  ansible.builtin.get_url:
    url: https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
    dest: /tmp/prometheus.tar.gz
    mode: "0644"

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/prometheus-3.5.0.linux-amd64

- name: Install Prometheus binary
  ansible.builtin.copy:
    src: /tmp/prometheus-3.5.0.linux-amd64/prometheus
    dest: /usr/local/bin/prometheus
    owner: prometheus
    group: prometheus
    mode: "0755"
    remote_src: true
  notify: Restart prometheus

- name: Install promtool
  ansible.builtin.copy:
    src: /tmp/prometheus-3.5.0.linux-amd64/promtool
    dest: /usr/local/bin/promtool
    owner: prometheus
    group: prometheus
    mode: "0755"
    remote_src: true

- name: Configure Prometheus
  ansible.builtin.copy:
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets:
                - localhost:{{ prometheus_port }}

        - job_name: node_exporter
          static_configs:
            - targets:
                - localhost:{{ node_exporter_port }}
  notify: Restart prometheus

- name: Create Prometheus systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --web.listen-address=0.0.0.0:{{ prometheus_port }}
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify:
    - Restart prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

# ============================================================
# Grafana
# ============================================================

- name: Install Grafana dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - software-properties-common
      - gnupg
      - ca-certificates
    state: present
    update_cache: true

- name: Add Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: Configure Grafana port
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: "^;?http_port ="
    line: "http_port = {{ grafana_port }}"
  notify: Restart grafana

- name: Create Grafana datasource directory
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: root
    group: grafana
    mode: "0755"

- name: Configure Prometheus datasource
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0644"
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://localhost:{{ prometheus_port }}
          isDefault: true
          editable: true
  notify: Restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

# ============================================================
# Grafana dashboard
# ============================================================

- name: Wait for Grafana
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  retries: 20
  delay: 3
  until: grafana_health.status == 200

- name: Create CPU and memory dashboard
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/dashboards/db"
    method: POST
    user: admin
    password: admin
    force_basic_auth: true
    body_format: json
    status_code:
      - 200
      - 412
    body:
      dashboard:
        title: "Node Exporter - CPU & Memory"
        tags:
          - ansible
          - node_exporter
        timezone: browser
        panels:
          - id: 1
            title: "CPU Usage"
            type: timeseries
            datasource:
              type: prometheus
              uid: prometheus
            targets:
              - expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
                legendFormat: "CPU Usage %"
            fieldConfig:
              defaults:
                unit: percent
            gridPos:
              h: 8
              w: 12
              x: 0
              y: 0

          - id: 2
            title: "Memory Usage"
            type: timeseries
            datasource:
              type: prometheus
              uid: prometheus
            targets:
              - expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'
                legendFormat: "Memory Usage %"
            fieldConfig:
              defaults:
                unit: percent
            gridPos:
              h: 8
              w: 12
              x: 12
              y: 0

        schemaVersion: 39
        version: 1
        refresh: "10s"
      overwrite: true
